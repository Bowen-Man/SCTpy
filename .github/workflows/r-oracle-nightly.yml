name: R oracle nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-oracle-nightly
  cancel-in-progress: false

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sctransform@0.4.3
            bioc::glmGamPoi@1.22.0
            any::matrixStats@1.5.0
          install-pandoc: false
      - name: Verify isolated oracle versions
        shell: Rscript {0}
        run: |
          expected <- c(
            sctransform = "0.4.3",
            glmGamPoi = "1.22.0",
            matrixStats = "1.5.0"
          )
          actual <- vapply(
            names(expected),
            function(package) as.character(packageVersion(package)),
            character(1)
          )
          if (!identical(actual, expected)) {
            stop(paste("oracle version mismatch:", paste(actual, collapse = ", ")))
          }
      - name: Install native package and fixed Level-B oracle
        run: |
          python -m pip install -e .
          python -m pip install "git+https://github.com/Bowen-Man/sctransform-cpu.git@b79041796e3f7ca3b33029adde5d7132eedd2430"
      - name: Generate the fixed large fixture
        run: |
          python -m benchmarks.generate_fixture --output benchmark-results/nightly/fixture.npz --genes 3200 --cells 240 --seed 20261102
      - name: Export Level-A and Level-B black-box results
        run: |
          timeout 1800 Rscript benchmarks/export_r_oracle.R benchmark-results/nightly/fixture benchmark-results/nightly/r-oracle
          timeout 1800 python -m benchmarks.export_reference --fixture benchmark-results/nightly/fixture.npz --manifest benchmark-results/nightly/fixture.selection.json --output benchmark-results/nightly/reference-v0.4.0.npz
      - name: Enforce the full differential gate
        run: |
          timeout 1800 python -m benchmarks.compare_correctness --fixture benchmark-results/nightly/fixture.npz --manifest benchmark-results/nightly/fixture.selection.json --r-oracle benchmark-results/nightly/r-oracle --reference benchmark-results/nightly/reference-v0.4.0.npz --fit-method cox_reid --cox-reid-gene-bin-size 500 --dispersion-regularization sct_v2 --regularization-method r_stats --regularization-support clamp --theta-postprocess moment_ratio --output benchmark-results/nightly/correctness.json --enforce
          python -m benchmarks.diagnose_regularization --fixture benchmark-results/nightly/fixture.npz --r-oracle benchmark-results/nightly/r-oracle --output benchmark-results/nightly/regularization-reinjection.json --enforce
          python -m benchmarks.diagnose_residuals --fixture benchmark-results/nightly/fixture.npz --r-oracle benchmark-results/nightly/r-oracle --output benchmark-results/nightly/residual-reinjection.json --enforce
      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r-oracle-nightly-${{ github.run_id }}
          path: |
            benchmark-results/nightly/correctness.json
            benchmark-results/nightly/regularization-reinjection.json
            benchmark-results/nightly/residual-reinjection.json
            benchmark-results/nightly/fixture.provenance.json
            benchmark-results/nightly/fixture.selection.json
            benchmark-results/nightly/reference-v0.4.0.provenance.json
            benchmark-results/nightly/r-oracle/metadata.tsv
          if-no-files-found: warn
          retention-days: 14
