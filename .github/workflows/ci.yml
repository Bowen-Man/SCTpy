name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Check Python style
        run: |
          python -m pip install -e ".[lint,anndata]"
          ruff check .
          ruff format --check .
          mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-15-intel
            python-version: "3.10"
          - os: macos-15-intel
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test,anndata,benchmark]"
      - name: Run tests
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test source distribution
        shell: bash
        run: |
          mkdir /tmp/sct-sdist
          tar -xzf dist/*.tar.gz -C /tmp/sct-sdist
          sdist_dir=$(find /tmp/sct-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)
          python -m venv /tmp/sct-sdist-smoke
          /tmp/sct-sdist-smoke/bin/python -m pip install "$sdist_dir[test]"
          (cd "$sdist_dir" && /tmp/sct-sdist-smoke/bin/python -m pytest)
      - name: Isolated wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/sct-wheel-smoke
          /tmp/sct-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/sct-wheel-smoke/bin/python -c "import sctpy; assert sctpy.__version__ == '0.1.0a1'"
