name: Real-data validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: real-data-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pbmc:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'real-data-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sctransform@0.4.3
            bioc::glmGamPoi@1.22.0
            any::matrixStats@1.5.0
          install-pandoc: false
      - name: Install native package and fixed Level-B oracle
        run: |
          python -m pip install -e ".[real-data]"
          python -m pip install "git+https://github.com/Bowen-Man/sctransform-cpu.git@b79041796e3f7ca3b33029adde5d7132eedd2430"
      - name: Download and derive the fixed sparse PBMC fixture
        run: |
          mkdir -p benchmark-results/real-data
          curl --fail --location --retry 3 --output benchmark-results/real-data/source.h5 "https://cf.10xgenomics.com/samples/cell-exp/6.1.0/10k_PBMC_3p_nextgem_Chromium_X/10k_PBMC_3p_nextgem_Chromium_X_filtered_feature_bc_matrix.h5"
          python -m benchmarks.prepare_pbmc_fixture --input benchmark-results/real-data/source.h5 --output benchmark-results/real-data/fixture.npz --cells 3000 --seed 20261103
      - name: Freeze Level-A selection and replay it in Levels B and C
        run: |
          timeout 1800 Rscript benchmarks/export_r_oracle.R benchmark-results/real-data/fixture benchmark-results/real-data/r-oracle 2000 2000 20261103
          python -m benchmarks.freeze_oracle_selection --fixture benchmark-results/real-data/fixture.npz --r-oracle benchmark-results/real-data/r-oracle --output benchmark-results/real-data/fixture.selection.json --seed 20261103
          timeout 1800 python -m benchmarks.export_reference --fixture benchmark-results/real-data/fixture.npz --manifest benchmark-results/real-data/fixture.selection.json --output benchmark-results/real-data/reference-v0.4.0.npz
          timeout 1800 python -m benchmarks.compare_correctness --fixture benchmark-results/real-data/fixture.npz --manifest benchmark-results/real-data/fixture.selection.json --r-oracle benchmark-results/real-data/r-oracle --reference benchmark-results/real-data/reference-v0.4.0.npz --fit-method cox_reid --cox-reid-gene-bin-size 500 --cox-reid-batch-size 64 --dispersion-regularization sct_v2 --regularization-method r_stats --regularization-support clamp --theta-postprocess moment_ratio --output benchmark-results/real-data/correctness.json --enforce
      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pbmc-validation-${{ github.run_id }}
          path: |
            benchmark-results/real-data/correctness.json
            benchmark-results/real-data/fixture.provenance.json
            benchmark-results/real-data/fixture.selection.json
            benchmark-results/real-data/reference-v0.4.0.provenance.json
            benchmark-results/real-data/r-oracle/metadata.tsv
          if-no-files-found: warn
          retention-days: 14
