[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sctransform-native"
version = "0.1.0a1"
description = "Independent native Python SCTransform v2 research implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  { name = "Bowen Man", email = "owenman27@126.com" },
]
keywords = ["single-cell", "sctransform", "normalization", "pearson-residuals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23.5",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23",
  "pytest>=8",
]
lint = [
  "ruff>=0.11",
]
benchmark = [
  "psutil>=5.9",
]
real-data = [
  "h5py>=3.10",
]
anndata = [
  "anndata>=0.10.8",
]
gpu-cuda12 = [
  "cupy-cuda12x>=14,<15",
]
gpu-cuda13 = [
  "cupy-cuda13x>=14,<15",
]

[project.urls]
Homepage = "https://github.com/Bowen-Man/sctransform-native"
Issues = "https://github.com/Bowen-Man/sctransform-native/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires an installed CuPy package and a working CUDA device",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["benchmark-results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]
